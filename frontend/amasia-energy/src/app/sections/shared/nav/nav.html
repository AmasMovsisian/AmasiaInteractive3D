<nav class="nav max-width">
  <div class="nav__container">
<a
  href="/"
  class="logo"
  (click)="goToStart($event)"
>
  <h2>AMASIA</h2>
</a>
    <ul class="nav__links">
      <li>
        <a href="#about" (click)="scrollToSection('about')"> About </a>
      </li>

      <li>
        <a href="#pricing" (click)="scrollToSection('pricing')"> Pricing </a>
      </li>

      <li>
        <a href="#flavors" (click)="scrollToSection('flavors')"> Flavors </a>
      </li>

      <li>
        <a href="#contact" (click)="scrollToSection('contact')"> Contact </a>
      </li>
    </ul>

    <div class="nav__actions">
      <button
        class="theme-switch"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <span class="theme-switch__track">
          <span class="theme-switch__indicator"></span>
        </span>

        <span class="theme-switch__label">
          {{ isDarkMode ? 'Dark' : 'Light' }}
        </span>
      </button>

      <a routerLink="/coming-soon" class="button nav__cta"> REQUEST ACCESS </a>

      <button
        class="hamburger"
        type="button"
        (click)="toggleMenu()"
        [class.active]="menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="menuOpen" [attr.aria-hidden]="!menuOpen">
    <div class="mobile-menu__glow mobile-menu__glow--one"></div>

    <div class="mobile-menu__glow mobile-menu__glow--two"></div>

    <div class="mobile-menu__grid"></div>

    <div class="mobile-menu__header">
      <span class="mobile-menu__eyebrow"> AMASIA </span>

      <span class="mobile-menu__status"> MENU </span>
    </div>

    <nav class="mobile-menu__nav">
      <a href="#about" (click)="scrollToSection('about')">
        <span class="mobile-menu__number"> 01 </span>

        <span class="mobile-menu__link"> About </span>

        <span class="mobile-menu__arrow" aria-hidden="true">
          <span class="mobile-menu__arrow-line"></span>
        </span>
      </a>

      <a href="#flavors" (click)="scrollToSection('flavors')">
        <span class="mobile-menu__number"> 02 </span>

        <span class="mobile-menu__link"> Flavors </span>

        <span class="mobile-menu__arrow" aria-hidden="true">
          <span class="mobile-menu__arrow-line"></span>
        </span>
      </a>

      <a href="#pricing" (click)="scrollToSection('pricing')">
        <span class="mobile-menu__number"> 03 </span>

        <span class="mobile-menu__link"> Pricing </span>

        <span class="mobile-menu__arrow" aria-hidden="true">
          <span class="mobile-menu__arrow-line"></span>
        </span>
      </a>

      <a href="#contact" (click)="scrollToSection('contact')">
        <span class="mobile-menu__number"> 04 </span>

        <span class="mobile-menu__link"> Contact </span>

        <span class="mobile-menu__arrow" aria-hidden="true">
          <span class="mobile-menu__arrow-line"></span>
        </span>
      </a>
    </nav>

    <div class="mobile-menu__bottom">
      <a routerLink="/coming-soon" class="button mobile-menu__cta" (click)="closeMenu()">
        REQUEST ACCESS
      </a>
    </div>
  </div>
</nav>
