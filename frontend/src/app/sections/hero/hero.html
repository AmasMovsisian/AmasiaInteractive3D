<section class="hero">
  <app-nav></app-nav>

  <div class="hero-canvas-viewport">
    <canvas #canvas class="hero-canvas"></canvas>
  </div>

  <div class="portrait-only-overlay" aria-hidden="true">
    <div class="portrait-only-content">
      <a routerLink="/" class="portrait-only-logo">
        <h2>AMASIA</h2>
      </a>

      <h3>PLEASE ROTATE YOUR DEVICE</h3>

      <p class="portrait-only-message">
        This experience is designed for portrait orientation. Please rotate your device to continue.
      </p>
    </div>
  </div>

  @if (loading()) {
    <div class="hero-loading">
      <div class="hero-loading-content">
        <h1 class="hero-loading-brand">AMASIA</h1>

        <div class="hero-loading-divider"></div>

        <div class="hero-loading-message">
          <span> INITIALIZING EXPERIENCE </span>

          <span class="hero-loading-dots" aria-hidden="true">
            <i></i>
            <i></i>
            <i></i>
          </span>
        </div>

        <div class="hero-loading-line" aria-hidden="true">
          <span></span>
        </div>

        <div class="hero-loading-status">LOADING 3D EXPERIENCE</div>
      </div>
    </div>
  }
</section>

<app-scroll-story></app-scroll-story>

<app-new-flavors></app-new-flavors>

<app-contact id="contact"></app-contact>

<app-footer></app-footer>
