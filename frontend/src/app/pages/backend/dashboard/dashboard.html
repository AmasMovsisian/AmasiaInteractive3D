<section class="dashboard">
  <app-nav></app-nav>
  <main class="dashboard-main">
    @if (isLoading) {
      <section class="dashboard-loading">
        <div class="loading-line"></div>
        <span>LOADING ACCOUNT</span>
      </section>
    }
    @if (errorMessage) {
      <section class="dashboard-error">
        <span class="status-dot"></span>
        <div>
          <span class="error-label">ACCOUNT ERROR</span>
          <p>{{ errorMessage }}</p>
        </div>
      </section>
    }
    @if (user; as currentUser) {
      <section class="account-hero">
        <div class="hero-copy">
          <h2 class="hero-welcome">WELCOME BACK</h2>
          <h1>
            {{ currentUser.username }}
          </h1>
          <p class="hero-description">Your private space at AMASIA</p>
        </div>
      </section>
      <section class="account-section">
        <div class="section-header">
          <span>YOUR ACCOUNT</span>
        </div>
        <div class="account-grid">
          <div class="profile-column">
            <app-profile-card
              [user]="currentUser"
              [profileImageUrl]="profileImageUrl"
              (openSettings)="openProfileSettings()"
              (profileImageError)="onProfileImageError($event)"
            ></app-profile-card>
          </div>
          <div class="orders-column">
            <app-orders-card></app-orders-card>
          </div>
        </div>
      </section>
    }
  </main>
</section>
@if (isProfileSettingsOpen && user; as currentUser) {
  <app-profile-settings-dialog
    [user]="currentUser"
    (close)="closeProfileSettings()"
    (userUpdated)="onUserUpdated($event)"
  ></app-profile-settings-dialog>
}
<app-footer></app-footer>
